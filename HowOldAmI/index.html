<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
	<head>
		<title>How Old Am I?</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<meta name="description" content="Calculates my exact age in years, months, and days">
		<meta name="author" content="Vadym Zakrevskyy">
		<meta name="keywords" content="age calculator, birthday, age">
		<link rel="shortcut icon" type="image/png" href="./favicon.png"/>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<link rel="stylesheet" type="text/css" href="CSS/main.css">
		<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
		<script src="Scripts/main.js"></script>
		<script>
			$(function () {
				Main.CreateInstance({
					dob: new Date("1977-07-27")
				});
			});
		</script>
	</head>
	<body class="bg-dark text-light min-vh-100">
		<div class="container-fluid py-4">
			<div class="row justify-content-center">
				<div class="col-12 col-md-8 col-lg-6">
					<div class="card bg-dark border-secondary shadow-lg">
						<div class="card-body text-center p-4">
							<h1 class="display-4 fw-bold text-primary mb-4">
								How Old Am I?
							</h1>
							<div class="age-display mb-4">
								<div class="row g-3">
									<div class="col-4">
										<div class="age-card bg-secondary bg-opacity-25 rounded-3 p-3">
											<div class="age-value display-6 fw-bold text-info"></div>
											<div class="age-label small text-muted">Years</div>
										</div>
									</div>
									<div class="col-4">
										<div class="age-card bg-secondary bg-opacity-25 rounded-3 p-3">
											<div class="age-value display-6 fw-bold text-warning"></div>
											<div class="age-label small text-muted">Months</div>
										</div>
									</div>
									<div class="col-4">
										<div class="age-card bg-secondary bg-opacity-25 rounded-3 p-3">
											<div class="age-value display-6 fw-bold text-success"></div>
											<div class="age-label small text-muted">Days</div>
										</div>
									</div>
								</div>
							</div>
							<div class="birthday-text fs-5 text-light opacity-75"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
